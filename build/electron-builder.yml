appId: com.cuyocode.security
productName: CuyoCode Security
directories:
  output: release
  buildResources: resources
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - profiles/**/*
  - rules/**/*.json
  - engine/lab/targets/**/*
asarUnpack:
  - engine/lab/targets/**/*
win:
  target: nsis
  icon: resources/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
